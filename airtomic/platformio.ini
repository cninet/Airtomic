; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = gateway_sensor_test
; Keep linker output out of the OneDrive path that contains Thai characters.
build_dir = ${platformio.core_dir}/build/${PROJECT_HASH}

[env]
platform = espressif32 @ 8.0.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

[env:sensor_node]
upload_port = COM5
monitor_port = COM5
build_src_filter = +<main.cpp>
lib_deps = adafruit/DHT sensor library @ 1.4.6

[env:gateway]
upload_port = COM6
monitor_port = COM6
build_src_filter = +<gateway/>
lib_deps = bblanchon/ArduinoJson @ 7.4.2

[env:gateway_sensor_test]
upload_port = ${env:gateway.upload_port}
upload_speed = 115200
monitor_port = ${env:gateway.monitor_port}
build_src_filter = +<gateway_sensor_test.cpp> +<gateway/local_sensors.cpp>
